<style>
  :root{
    --soil:#2A2013;
    --leaf:#2F6B3C;
    --leaf-dark:#204A29;
    --leaf-light:#E8F3EA;
    --turmeric:#E3A008;
    --turmeric-light:#FBEFCF;
    --wheat:#FBF7EC;
    --wheat-deep:#F3EBD8;
    --clay:#B5502D;
    --clay-light:#F6E3DA;
    --ink:#2A2420;
    --muted:#7A6F60;
    --line:#E4DAC4;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --wheat:#1C1712; --wheat-deep:#241D15; --ink:#F3EEE2; --muted:#B4A98F; --line:#3A3122;
      --leaf-light:#1E2E22;
    }
  }
  :root[data-theme="dark"]{
    --wheat:#1C1712; --wheat-deep:#241D15; --ink:#F3EEE2; --muted:#B4A98F; --line:#3A3122;
    --leaf-light:#1E2E22;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--wheat); color:var(--ink);
    font-family:'Inter',sans-serif;
    margin:0; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Baloo 2',sans-serif;}
  .telugu{font-family:'Noto Sans Telugu','Inter',sans-serif;}
  .app-shell{max-width:480px;margin:0 auto;min-height:100vh;background:var(--wheat);position:relative;padding-bottom:84px;}
  .topbar{position:sticky;top:0;z-index:30;background:var(--wheat);border-bottom:1px solid var(--line);}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  .btn-primary{background:var(--leaf);color:#fff;font-weight:600;border-radius:12px;padding:14px 18px;border:none;font-size:15px;transition:transform .08s ease, background .15s ease;}
  .btn-primary:active{transform:scale(.97);background:var(--leaf-dark);}
  .btn-secondary{background:transparent;color:var(--leaf);font-weight:600;border-radius:12px;padding:14px 18px;border:1.5px solid var(--leaf);font-size:15px;}
  .btn-secondary:active{transform:scale(.97);}
  .btn-clay{background:var(--clay);color:#fff;font-weight:600;border-radius:12px;padding:14px 18px;border:none;font-size:15px;}
  .btn-clay:active{transform:scale(.97);}
  .btn-ghost{background:var(--wheat-deep);color:var(--ink);font-weight:600;border-radius:12px;padding:10px 14px;border:1px solid var(--line);font-size:14px;}
  input,select,textarea{

  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) input,:root:not([data-theme="light"]) select,:root:not([data-theme="light"]) textarea{background:#26201A;}}

  label.field-label{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px;display:block;}

  .card{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden;}
  :root[data-theme="dark"] .card{background:#221C15;}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card{background:#221C15;}}
  .card-accent{border-left:4px solid var(--leaf);}
  .card-accent.clay{border-left-color:var(--clay);}
  .card-accent.turmeric{border-left-color:var(--turmeric);}
  .card-accent.muted{border-left-color:var(--line);}

  .chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:100px;}

  .chip-sold{background:var(--wheat-deep);color:var(--muted);}

  .chip-rejected{background:var(--clay-light);color:var(--clay);}

  .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom);}
  :root[data-theme="dark"] .bottom-nav{background:#221C15;}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bottom-nav{background:#221C15;}}
  .nav-item{flex:1;text-align:center;padding:9px 2px 8px;font-size:10.5px;font-weight:600;color:var(--muted);border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;}

  .nav-icon{font-size:19px;line-height:1;}

  .fab-mic{position:fixed;bottom:96px;left:50%;transform:translateX(calc(-50% + 178px));width:56px;height:56px;border-radius:50%;background:var(--turmeric);color:#fff;border:none;box-shadow:0 6px 18px rgba(227,160,8,.4);font-size:22px;z-index:41;}
  .fab-mic.listening{animation:pulse 1.1s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(227,160,8,.55);}70%{box-shadow:0 0 0 16px rgba(227,160,8,0);}100%{box-shadow:0 0 0 0 rgba(227,160,8,0);}}

  .toast-wrap{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;z-index:100;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
  .toast{background:var(--ink);color:var(--wheat);padding:12px 16px;border-radius:10px;font-size:13.5px;font-weight:500;box-shadow:0 8px 20px rgba(0,0,0,.18);}

  .skip-link:focus{position:fixed;top:8px;left:8px;background:#fff;padding:8px 12px;border-radius:8px;z-index:200;}
  a{color:inherit;}
  .tab-btn{padding:9px 14px;border-radius:100px;font-size:13px;font-weight:600;border:1.5px solid var(--line);background:#fff;color:var(--muted);white-space:nowrap;}
  .tab-btn.active{background:var(--leaf);color:#fff;border-color:var(--leaf);}
  :root[data-theme="dark"] .tab-btn{background:#221C15;}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab-btn{background:#221C15;}}
  .scroll-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
  .scroll-row::-webkit-scrollbar{display:none;}

  .veg-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--leaf-light);flex-shrink:0;}
  .stat-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;}
  :root[data-theme="dark"] .stat-box{background:#221C15;}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stat-box{background:#221C15;}}
</style>
</head>
<body>

<script>
/* ============================= STORAGE ============================= */
const STORE_KEY='kisan_direct_state_v1';
function loadState(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.warn('storage read failed',e); }
  return seedData();
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn('storage write failed',e); }
}
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9); }

/* ============================= SEED DEMO DATA ============================= */
function seedData(){

  const products=[

      location:'Kothapalli, Warangal',description:'Premium quality Sona Masoori rice, dried and cleaned.',status:'active',createdAt:daysAgo(15),icon:'🌾'},
    {id:'p3',farmerId:'u_farmer2',name:'Turmeric',category:'Spices',quantity:8,unit:'quintal',price:7800,harvestDate:daysAgo(30),
      location:'Peddapuram, East Godavari',description:'Polished turmeric fingers, high curcumin content.',status:'active',createdAt:daysAgo(10),icon:'🟡'},
    {id:'p4',farmerId:'u_farmer2',name:'Chilli',category:'Spices',quantity:15,unit:'quintal',price:16000,harvestDate:daysAgo(12),
      location:'Peddapuram, East Godavari',description:'Guntur-style dried red chilli, medium-hot.',status:'active',createdAt:daysAgo(6),icon:'🌶️'},
    {id:'p5',farmerId:'u_farmer1',name:'Cotton',category:'Cash Crops',quantity:12,unit:'quintal',price:6700,harvestDate:daysAgo(25),
      location:'Kothapalli, Warangal',description:'Machine-picked cotton, low moisture.',status:'sold',createdAt:daysAgo(28),icon:'☁️'},
    {id:'p6',farmerId:'u_farmer2',name:'Maize',category:'Grains',quantity:30,unit:'quintal',price:1950,harvestDate:daysAgo(8),
      location:'Peddapuram, East Godavari',description:'Yellow maize, suitable for poultry feed and export.',status:'active',createdAt:daysAgo(4),icon:'🌽'}
  ];
  const enquiries=[
    {id:'e1',buyerId:'u_buyer1',farmerId:'u_farmer1',productId:'p1',message:"I'm interested in buying 500 kg of this product.",status:'pending',createdAt:daysAgo(1)},
    {id:'e2',buyerId:'u_buyer1',farmerId:'u_farmer2',productId:'p3',message:"I'm interested in buying 2 quintal of this product.",status:'accepted',createdAt:daysAgo(3)}
  ];

  const notifications=[
    {id:'n1',userId:'u_farmer1',message:'Suresh Traders sent an enquiry for your Tomato listing.',read:false,createdAt:daysAgo(1)},
    {id:'n2',userId:'u_farmer2',message:'Your Turmeric enquiry from Suresh Traders was accepted.',read:true,createdAt:daysAgo(3)}

  return {users,products,enquiries,favorites,notifications,currentUserId:null,seededAt:now};

function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString(); }

let state = loadState();

/* Demo market price data - clearly labeled, not live government data */
const DEMO_MARKET_PRICES=[
  {crop:'Tomato',market:'Warangal Market Yard',price:'₹18–22 / kg',date:'Today',unit:'kg'},
  {crop:'Rice (Sona Masoori)',market:'Hyderabad Wholesale',price:'₹2,150–2,300 / quintal',date:'Today',unit:'quintal'},
  {crop:'Turmeric',market:'Nizamabad Turmeric Market',price:'₹7,500–8,100 / quintal',date:'Yesterday',unit:'quintal'},
  {crop:'Chilli (Guntur)',market:'Guntur Chilli Yard',price:'₹15,500–16,800 / quintal',date:'Today',unit:'quintal'},
  {crop:'Cotton',market:'Adilabad Market Yard',price:'₹6,500–6,900 / quintal',date:'2 days ago',unit:'quintal'},
  {crop:'Maize',market:'Khammam Market Yard',price:'₹1,900–2,050 / quintal',date:'Today',unit:'quintal'}
];
const CATEGORIES=['Vegetables','Grains','Spices','Cash Crops','Fruits','Pulses'];
const STATES_DISTRICTS={
  'Telangana':['Warangal','Hyderabad','Khammam','Nizamabad','Adilabad','Karimnagar'],
  'Andhra Pradesh':['East Godavari','Guntur','Krishna','Chittoor','Visakhapatnam']
};

/* ============================= HELPERS ============================= */
function currentUser(){ return state.users.find(u=>u.id===state.currentUserId) || null; }
function farmerById(id){ return state.users.find(u=>u.id===id); }
function productById(id){ return state.products.find(p=>p.id===id); }
function fmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); }
function fmtWhen(iso){
  const diff=Date.now()-new Date(iso).getTime();
  const days=Math.floor(diff/86400000);
  if(days<=0) return 'today';
  if(days===1) return '1 day ago';
  return days+' days ago';
}
function toast(msg){
  const wrap=document.getElementById('toastWrap');
  const el=document.createElement('div');
  el.className='toast'; el.textContent=msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); },2200);
}
function addNotification(userId,message){
  state.notifications.unshift({id:uid('n'),userId,message,read:false,createdAt:new Date().toISOString()});
}
function unreadCount(userId){
  return state.notifications.filter(n=>n.userId===userId && !n.read).length;
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================= ROUTER ============================= */
window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', ()=>{ if(!location.hash) location.hash='#/home'; route(); });
function go(hash){ location.hash=hash; }
function route(){
  const hash = location.hash || '#/home';
  const [path, qs] = hash.slice(2).split('?');
  const parts = path.split('/').filter(Boolean);
  const params = new URLSearchParams(qs||'');
  const user = currentUser();

  // route guards
  const protectedFarmer = parts[0]==='farmer';
  const protectedBuyer = parts[0]==='buyer';
  const protectedAdmin = parts[0]==='admin';
  if((protectedFarmer && (!user||user.role!=='farmer')) ||
     (protectedBuyer && (!user||user.role!=='buyer')) ||
     (protectedAdmin && (!user||user.role!=='admin'))){
    toast('Please log in to continue');
    location.hash='#/login'; return;
  }

  let html='';
  if(path===''||path==='home') html=renderHome();
  else if(path==='login') html=renderLogin();
  else if(path==='signup') html=renderSignup();
  else if(path==='forgot') html=renderForgot();
  else if(path==='market') html=renderMarket();
  else if(path==='voice') html=renderVoice();
  else if(parts[0]==='farmer') html=renderFarmerRoute(parts,params);
  else if(parts[0]==='buyer') html=renderBuyerRoute(parts,params);
  else if(parts[0]==='admin') html=renderAdmin();
  else html=renderHome();

  document.getElementById('main').innerHTML = html + renderNav();
  window.scrollTo(0,0);
}

/* ============================= LAYOUT PARTS ============================= */
function topbar(title,opts={}){
  const back = opts.back ? `<button onclick="history.back()" class="btn-ghost" style="padding:8px 11px;" aria-label="Back">←</button>` : '';
  const user=currentUser();
  const bell = user ? `<button onclick="go('#/${user.role}/notifications')" class="btn-ghost" style="padding:8px 11px;position:relative;" aria-label="Notifications">🔔${unreadCount(user.id)>0?`<span style="position:absolute;top:4px;right:5px;width:7px;height:7px;background:var(--clay);border-radius:50%;"></span>`:''}</button>` : '';
  return `<div class="topbar"><div class="flex items-center justify-between gap-2 px-4 py-3">
    <div class="flex items-center gap-2">${back}<h1 class="display font-bold text-lg" style="color:var(--leaf-dark)">${title}</h1></div>
    <div class="flex items-center gap-2">${bell}</div>
  </div></div>`;
}
function renderNav(){
  const user=currentUser();
  if(!user){
    return `<div class="bottom-nav">
      <button class="nav-item ${loc('home')}" onclick="go('#/home')"><span class="nav-icon">🏠</span>Home</button>
      <button class="nav-item ${loc('market')}" onclick="go('#/market')"><span class="nav-icon">📊</span>Market</button>
      <button class="nav-item ${loc('login')}" onclick="go('#/login')"><span class="nav-icon">🔑</span>Login</button>
    </div>`;
  }
  if(user.role==='farmer'){
    return `<div class="bottom-nav">
      <button class="nav-item ${loc('farmer/dashboard')}" onclick="go('#/farmer/dashboard')"><span class="nav-icon">🏠</span>Home</button>
      <button class="nav-item ${loc('farmer/products')}" onclick="go('#/farmer/products')"><span class="nav-icon">🌿</span>Products</button>
      <button class="nav-item ${loc('farmer/enquiries')}" onclick="go('#/farmer/enquiries')"><span class="nav-icon">💬</span>Enquiries</button>
      <button class="nav-item ${loc('voice')}" onclick="go('#/voice')"><span class="nav-icon">🎙️</span>Voice</button>
      <button class="nav-item ${loc('farmer/profile')}" onclick="go('#/farmer/profile')"><span class="nav-icon">👤</span>Profile</button>
    </div>`;
  }
  if(user.role==='buyer'){
    return `<div class="bottom-nav">
      <button class="nav-item ${loc('buyer/dashboard')}" onclick="go('#/buyer/dashboard')"><span class="nav-icon">🏠</span>Home</button>
      <button class="nav-item ${loc('buyer/search')}" onclick="go('#/buyer/search')"><span class="nav-icon">🔍</span>Search</button>
      <button class="nav-item ${loc('buyer/favorites')}" onclick="go('#/buyer/favorites')"><span class="nav-icon">❤️</span>Favorites</button>
      <button class="nav-item ${loc('buyer/enquiries')}" onclick="go('#/buyer/enquiries')"><span class="nav-icon">💬</span>Enquiries</button>
      <button class="nav-item ${loc('buyer/profile')}" onclick="go('#/buyer/profile')"><span class="nav-icon">👤</span>Profile</button>
    </div>`;
  }
  if(user.role==='admin'){
    return `<div class="bottom-nav">
      <button class="nav-item ${loc('admin')}" onclick="go('#/admin')"><span class="nav-icon">🛡️</span>Admin</button>
      <button class="nav-item" onclick="logout()"><span class="nav-icon">🚪</span>Logout</button>
    </div>`;
  }
  return '';
}
function loc(p){ return (location.hash.slice(2)||'home').startsWith(p) ? 'active' : ''; }

/* ============================= HOME ============================= */
function renderHome(){
  const user=currentUser();
  return `
  <div style="background:linear-gradient(180deg,var(--leaf-light) 0%, var(--wheat) 65%);padding:20px 20px 26px;">
    <div class="flex items-center justify-between mb-5">
      <div class="flex items-center gap-2">
        <span style="font-size:26px;">🌱</span>
        <span class="display font-extrabold text-xl" style="color:var(--leaf-dark)">Kisan Direct</span>
      </div>
      ${user? `<button onclick="go('#/${user.role}/profile')" class="btn-ghost" style="padding:6px 10px;">${user.photo} ${esc(user.name.split(' ')[0])}</button>`

function renderFarmerRoute(parts,params){
  const page=parts[1]||'dashboard';
  if(page==='dashboard') return renderFarmerDashboard();
  if(page==='products') return renderFarmerProducts();
  if(page==='add-product') return renderProductForm(null);
  if(page==='edit-product') return renderProductForm(params.get('id'));
  if(page==='enquiries') return renderFarmerEnquiries();

  if(page==='notifications') return renderNotifications();
  return renderFarmerDashboard();
}

      <div class="stat-box text-center"><div class="font-extrabold text-xl" style="color:var(--turmeric);">${pending}</div><div style="font-size:11px;color:var(--muted);">New enquiries</div></div>
      <div class="stat-box text-center"><div class="font-extrabold text-xl" style="color:var(--clay);">${myProducts.filter(p=>p.status==='sold').length}</div><div style="font-size:11px;color:var(--muted);">Sold</div></div>
    </div>
    <div class="flex gap-2 mb-5">
      <button class="btn-primary flex-1" onclick="go('#/farmer/add-product')">+ Add Product</button>
      <button class="btn-clay flex-1" onclick="go('#/voice')">🎙️ Voice</button>
    </div>
    <h2 class="display font-bold text-base mb-2">Smart Suggestions</h2>
    ${renderFarmerSuggestions(user)}
    <h2 class="display font-bold text-base mt-5 mb-2">My recent products</h2>
    <div class="flex flex-col gap-3">
      ${myProducts.length? myProducts.slice(0,3).map(p=>farmerProductCard(p)).join('') : emptyState('🌱','No products yet','Add your first crop to start selling.')}
    </div>
  </div>`;
}
function renderFarmerSuggestions(user){
  const others=state.products.filter(p=>p.farmerId!==user.id && p.status==='active');
  const myCats=new Set(state.products.filter(p=>p.farmerId===user.id).map(p=>p.category));
  const priceTip = others.filter(p=>myCats.has(p.category)).slice(0,2);
  const buyerInterest = state.enquiries.filter(e=>e.farmerId===user.id && e.status==='pending').length;
  const cards=[];
  if(buyerInterest>0) cards.push(sugCard('💬', buyerInterest+' buyer'+(buyerInterest>1?'s are':' is')+' waiting on your enquiries', 'Reply soon to close the sale.', "go('#/farmer/enquiries')"));
  priceTip.forEach(p=>{
    cards.push(sugCard('📈', `${p.name} is selling at ₹${p.price}/${p.unit} nearby`, 'Compare with your listing price.', `go('#/buyer/product/${p.id}')`));
  });
  if(!cards.length) cards.push(sugCard('✨','List more crops to get suggestions','We match your listings with nearby buyer demand.', "go('#/farmer/add-product')"));
  return `<div class="flex flex-col gap-2">${cards.slice(0,3).join('')}</div>`;
}

function saveProduct(e,editId){
  e.preventDefault();
  const user=currentUser();
  const data={
    name:document.getElementById('pfName').value.trim(),
    category:document.getElementById('pfCategory').value,
    quantity:parseFloat(document.getElementById('pfQty').value),
    unit:document.getElementById('pfUnit').value,
    price:parseFloat(document.getElementById('pfPrice').value),
    harvestDate:document.getElementById('pfHarvest').value,
    location:document.getElementById('pfLocation').value.trim(),
    icon:document.getElementById('pfIcon').value,
    description:document.getElementById('pfDesc').value.trim()
  };
  if(editId){
    const p=productById(editId); Object.assign(p,data);
    toast('Product updated');
  } else {
    state.products.unshift({id:uid('p'),farmerId:user.id,status:'active',createdAt:new Date().toISOString(),...data});
    toast('Product added! Buyers can now find it.');
  }
  saveState(); go('#/farmer/products');
  return false;
}

/* ============================= BUYER ROUTES ============================= */
function renderBuyerRoute(parts,params){
  const page=parts[1]||'dashboard';
  if(page==='dashboard') return renderBuyerDashboard();
  if(page==='search') return renderBuyerSearch();
  if(page==='product') return renderProductDetail(parts[2]||params.get('id'));
  if(page==='favorites') return renderBuyerFavorites();
  if(page==='enquiries') return renderBuyerEnquiries();
  if(page==='profile') return renderBuyerProfile();
  if(page==='notifications') return renderNotifications();
  return renderBuyerDashboard();
}
function renderBuyerDashboard(){
  const user=currentUser();
  const active=state.products.filter(p=>p.status==='active');
  const nearby=active.filter(p=>p.location.includes(user.district)).slice(0,4);
  return `${topbar('Kisan Direct')}
  <div class="px-5 py-4">
    <div class="card p-4 mb-4" style="background:var(--clay-light);border-color:var(--clay-light);">
      <div class="flex items-center gap-3">
        <div style="font-size:34px;">${user.photo}</div>
        <div><div class="font-bold" style="color:var(--clay)">Welcome, ${esc(user.name)}</div><div style="font-size:12.5px;color:var(--muted);">${esc(user.village)}, ${esc(user.district)}</div></div>
      </div>
    </div>
    <button class="btn-primary w-full mb-5" onclick="go('#/buyer/search')">🔍 Search Products</button>
    <h2 class="display font-bold text-base mb-2">Smart Suggestions</h2>
    ${renderBuyerSuggestions(user)}
    <h2 class="display font-bold text-base mt-5 mb-2">${nearby.length?'Near '+user.district:'Available now'}</h2>
    <div class="flex flex-col gap-3">${(nearby.length?nearby:active.slice(0,4)).map(p=>productCard(p)).join('')}</div>
  </div>`;
}
function renderBuyerSuggestions(user){
  const favCats=new Set(state.favorites.filter(f=>f.buyerId===user.id).map(f=>productById(f.productId)?.category).filter(Boolean));
  const cards=[];
  const matches=state.products.filter(p=>p.status==='active' && favCats.has(p.category));
  matches.slice(0,2).forEach(p=> cards.push(sugCard(p.icon||'🌿', `${p.name} matches your saved interests`, `₹${p.price}/${p.unit} · ${p.location}`, `go('#/buyer/product/${p.id}')`)));
  const recent=state.products.filter(p=>p.status==='active').sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))[0];
  if(recent) cards.push(sugCard('🆕', `New listing: ${recent.name}`, `${recent.location} · ₹${recent.price}/${recent.unit}`, `go('#/buyer/product/${recent.id}')`));
  if(!cards.length) cards.push(sugCard('✨','Save favorites to see suggestions','We will match new listings to your interests.', "go('#/buyer/search')"));
  return `<div class="flex flex-col gap-2">${cards.slice(0,3).join('')}</div>`;
}
function renderBuyerSearch(){
  const q=(window._buyerQ||'').toLowerCase();
  const cat=window._buyerCat||'all';
  const sortBy=window._buyerSort||'date';
  const locFilter=(window._buyerLoc||'').toLowerCase();
  let list=state.products.filter(p=>p.status==='active');
  if(q) list=list.filter(p=>p.name.toLowerCase().includes(q));
  if(cat!=='all') list=list.filter(p=>p.category===cat);
  if(locFilter) list=list.filter(p=>p.location.toLowerCase().includes(locFilter));
  if(sortBy==='price-asc') list=list.sort((a,b)=>a.price-b.price);
  else if(sortBy==='price-desc') list=list.sort((a,b)=>b.price-a.price);
  else if(sortBy==='date') list=list.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));

  return `${topbar('Search Products',{back:true})}
  <div class="px-5 py-4">
    <input id="searchBox" placeholder="Search crop, e.g. Tomato" value="${esc(window._buyerQ||'')}" oninput="window._buyerQ=this.value;renderSearchListOnly()" class="mb-3">
    <div class="scroll-row mb-2">
      <button class="tab-btn ${cat==='all'?'active':''}" onclick="window._buyerCat='all';route()">All</button>
      ${CATEGORIES.map(c=>`<button class="tab-btn ${cat===c?'active':''}" onclick="window._buyerCat='${c}';route()">${c}</button>`).join('')}
    </div>
    <div class="flex gap-2 mb-4">
      <input placeholder="Filter by location" value="${esc(window._buyerLoc||'')}" oninput="window._buyerLoc=this.value;renderSearchListOnly()" style="flex:1.4;">
      <select onchange="window._buyerSort=this.value;route()" style="flex:1;">
        <option value="date" ${sortBy==='date'?'selected':''}>Newest</option>
        <option value="price-asc" ${sortBy==='price-asc'?'selected':''}>Price ↑</option>
        <option value="price-desc" ${sortBy==='price-desc'?'selected':''}>Price ↓</option>
      </select>
    </div>
    <div id="searchResults" class="flex flex-col gap-3">
      ${list.length? list.map(p=>productCard(p)).join('') : emptyState('🔎','No matches','Try a different crop, category or location.')}
    </div>
  </div>`;
}
function renderSearchListOnly(){
  const el=document.getElementById('searchResults'); if(!el) return;
  const q=(window._buyerQ||'').toLowerCase();
  const cat=window._buyerCat||'all';
  const locFilter=(window._buyerLoc||'').toLowerCase();
  let list=state.products.filter(p=>p.status==='active');
  if(q) list=list.filter(p=>p.name.toLowerCase().includes(q));
  if(cat!=='all') list=list.filter(p=>p.category===cat);
  if(locFilter) list=list.filter(p=>p.location.toLowerCase().includes(locFilter));
  el.innerHTML = list.length? list.map(p=>productCard(p)).join('') : emptyState('🔎','No matches','Try a different crop, category or location.');
}

function openEnquiryForm(pid){
  const slot=document.getElementById('enquiryFormSlot');
  slot.innerHTML=`<div class="card p-3 mt-3">

}
function sendEnquiry(pid){
  const user=currentUser(); const p=productById(pid);
  const msg=document.getElementById('enqMsg').value.trim() || "I'm interested in this product.";
  state.enquiries.unshift({id:uid('e'),buyerId:user.id,farmerId:p.farmerId,productId:pid,message:msg,status:'pending',createdAt:new Date().toISOString()});
  addNotification(p.farmerId, `${user.name} sent an enquiry for your ${p.name} listing.`);
  saveState(); toast('Enquiry sent to farmer'); go('#/buyer/enquiries');
}
function contactFarmer(pid){
  const p=productById(pid); const farmer=farmerById(p.farmerId);
  toast('Demo contact: call/WhatsApp '+farmer.phone);
}
function requestProduct(pid){
  const p=productById(pid);
  openEnquiryForm(pid);
  setTimeout(()=>{ const box=document.getElementById('enqMsg'); if(box) box.value='I would like to request a custom quantity of '+p.name+'. Please let me know availability.'; },0);
}
function toggleFavorite(pid){
  const user=currentUser();
  const existing=state.favorites.find(f=>f.buyerId===user.id && f.productId===pid);

  else{ state.favorites.push({id:uid('f'),buyerId:user.id,productId:pid}); toast('Saved to favorites'); }
  saveState(); route();
}

    </div>
    <div class="card p-3 mt-3 text-left" style="background:var(--leaf-light);min-height:64px;">
      <div style="font-size:12px;color:var(--muted);">Assistant</div>
      <div id="assistantReply" style="font-size:14.5px;margin-top:4px;" class="telugu">నమస్తే! నేను మీకు ఎలా సహాయం చేయగలను?</div>
    </div>

    <form onsubmit="return submitTypedVoice(event)" class="flex gap-2 mt-4">
      <input id="typedVoice" placeholder="Type in Telugu or English…" style="flex:1;">
      <button class="btn-primary" style="padding:12px 16px;" type="submit">Send</button>
    </form>

    <div class="mt-5 text-left">
      <div class="font-semibold text-sm mb-2">Try saying:</div>
      <div class="flex flex-col gap-2">
        ${voiceExample('నా దగ్గర 500 కిలోల టమాటాలు ఉన్నాయి','I have 500 kg of tomatoes')}
        ${voiceExample('మార్కెట్ ధరలు చూపించు','Show market prices')}
        ${voiceExample('నా ఎంక్వైరీలు చూపించు','Show my enquiries')}
        ${voiceExample('సహాయం','Help / how to use the app')}
      </div>
    </div>
    <p style="font-size:11px;color:var(--muted);margin-top:16px;">Prototype note: speech-to-text and text-to-speech use your browser's built-in Telugu voice support. Understanding is rule-based for this demo, not a full LLM.</p>
  </div>`;
}
function voiceExample(te,en){
  return `<button class="card p-2.5 text-left" onclick="runVoiceCommand('${te.replace(/'/g,"\\'")}')">
    <div class="telugu" style="font-size:13.5px;">${te}</div>
    <div style="font-size:11.5px;color:var(--muted);">${en}</div>
  </button>`;
}
function toggleListen(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('Speech recognition not supported — please type instead'); return; }
  if(recognizing){ recognition && recognition.stop(); return; }
  recognition = new SR();
  recognition.lang='te-IN';
  recognition.interimResults=false;
  recognition.maxAlternatives=1;
  recognition.onstart=()=>{ recognizing=true; document.getElementById('micBtn').classList.add('listening'); document.getElementById('voiceStatus').textContent='Listening… speak now'; };
  recognition.onerror=(ev)=>{ document.getElementById('voiceStatus').textContent='Could not hear that. Try again or type below.'; };
  recognition.onend=()=>{ recognizing=false; const btn=document.getElementById('micBtn'); if(btn) btn.classList.remove('listening'); const st=document.getElementById('voiceStatus'); if(st) st.textContent='Tap the mic and speak'; };
  recognition.onresult=(ev)=>{
    const text=ev.results[0][0].transcript;
    runVoiceCommand(text);
  };
  try{ recognition.start(); }catch(err){ toast('Could not start microphone'); }
}
function submitTypedVoice(e){
  e.preventDefault();
  const val=document.getElementById('typedVoice').value.trim();
  if(!val) return false;
  runVoiceCommand(val);
  document.getElementById('typedVoice').value='';
  return false;
}
function runVoiceCommand(text){
  document.getElementById('transcriptText').textContent=text;
  const reply=processVoiceCommand(text);
  document.getElementById('assistantReply').textContent=reply.te;
  speak(reply.te);
  if(reply.action) setTimeout(reply.action, 900);
}
function speak(teText){
  if(!('speechSynthesis' in window)) return;
  try{
    const utter=new SpeechSynthesisUtterance(teText);
    utter.lang='te-IN'; utter.rate=0.95;
    const voices=speechSynthesis.getVoices();
    const teVoice=voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('te'));
    if(teVoice) utter.voice=teVoice;
    speechSynthesis.cancel();
    speechSynthesis.speak(utter);
  }catch(e){}
}
/* Simple rule-based Telugu/English command understanding for the prototype */
function processVoiceCommand(raw){
  const t=raw.toLowerCase();
  const user=currentUser();
  const qtyMatch=raw.match(/(\d+)\s*(kg|కిలో|క్వింటాల్|quintal)/i);

  const has=(...words)=>words.some(w=>t.includes(w));

  if(has('మార్కెట్','market','ధర','price')){
    return { te:'ఇదిగో ప్రస్తుత మార్కెట్ ధరలు (డెమో డేటా).', action:()=>go('#/market') };
  }
  if(has('ఎంక్వైరీ','enquiry','enquiries','విచారణ')){
    if(user && user.role==='farmer') return { te:'మీ ఎంక్వైరీలు చూపిస్తున్నాను.', action:()=>go('#/farmer/enquiries') };
    if(user && user.role==='buyer') return { te:'మీ ఎంక్వైరీలు చూపిస్తున్నాను.', action:()=>go('#/buyer/enquiries') };
    return { te:'దయచేసి ముందు లాగిన్ అవ్వండి.', action:()=>go('#/login') };
  }
  if(has('కొనుగోలు','search','వెతకండి','వెతుకు','buyer','కొనాలి')){
    return { te:'పంటల కోసం వెతుకుతున్నాను. శోధన పేజీ తెరుస్తున్నాను.', action:()=>go('#/buyer/search') };
  }
  if((has('నా దగ్గర','i have','add','జోడించ','అమ్మ') ) && user && user.role==='farmer'){
    const cropWord = ['టమాటా','tomato','వరి','rice','పసుపు','turmeric','మిరప','chilli','మొక్కజొన్న','maize','పత్తి','cotton'].find(c=>t.includes(c.toLowerCase()));
    const qty=qtyMatch?qtyMatch[1]:'';
    return { te:`బాగుంది! ${qty?qty+' కిలోల ':''}${cropWord?cropWord+' ':''}పంటను జోడించడానికి ఫారం తెరుస్తున్నాను.`, action:()=>go('#/farmer/add-product') };
  }
  if(has('సహాయం','help','ఎలా వాడాలి','how to use')){
    return { te:'నేను పంటలు జోడించడం, కొనుగోలుదారులను వెతకడం, మార్కెట్ ధరలు చూపడం మరియు ఎంక్వైరీలు చూడటంలో సహాయం చేయగలను.', action:null };
  }
  if(has('నమస్తే','hello','హాయ్','hi')){
    return { te: `నమస్తే${user?', '+user.name.split(' ')[0]:''}! కిసాన్ డైరెక్ట్‌కు స్వాగతం.`, action:null };
  }
  return { te:'క్షమించండి, నాకు అర్థం కాలేదు. మార్కెట్ ధరలు, ఎంక్వైరీలు, లేదా పంట జోడించడం గురించి అడగండి.', action:null };
}

/* ============================= INIT ============================= */
if(typeof speechSynthesis!=='undefined'){ speechSynthesis.onvoiceschanged=()=>{}; }
</script>
